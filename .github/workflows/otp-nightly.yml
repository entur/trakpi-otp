name: trakpi nightly (Entur OTP dev)

# Runs the trakpi OTP reference against the Entur OTP dev API nightly and streams the KPIs straight
# into BigQuery. GitHub cron is UTC and best-effort; scheduled runs only fire from the default branch.
on:
  schedule:
    - cron: "0 4 * * *" # 04:00 UTC (~05:00/06:00 Norway)
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  run:
    runs-on: ubuntu-latest
    environment: tst
    permissions:
      contents: read
      id-token: write # required for OIDC auth to GCP
    env:
      TRAKPI_BQ_PROJECT: ent-trakpiotp-tst # TODO add per-environment configuration
      TRAKPI_BQ_DATASET: kpi_tracking
      TRAKPI_BQ_TABLE: kpi_metrics_v1
      TRAKPI_GCS_BUCKET: ent-trakpiotp-tst-trakpi-archive
      TRAKPI_TESTSET_VERSION: 2026-06-24
      # TEMPORARILY HARDCODED: Baseline build to compare against. The run representing it is resolved from stored results.
      # Empty = no comparison. Bump this when a new build should become the baseline.
      TRAKPI_REFERENCE_VERSION: 2.10.0-entur-133
      # OTP dev endpoint. Used to resolve the deployed version under test.
      OTP_ENDPOINT: https://api.dev.entur.io/journey-planner/v3/graphql
      OTP_CLIENT_NAME: entur-trakpi-dev
    steps:
      - uses: actions/checkout@v4

      # Resolve the version under test up front, straight from the OTP dev API, and pass it to the run
      # as --version. Fails fast if the endpoint is unreachable so we don't record a run with no version.
      - name: Resolve OTP version under test
        id: otp
        run: |
          resp=$(curl -sf -m 30 -X POST "$OTP_ENDPOINT" \
            -H 'Content-Type: application/json' -H "ET-Client-Name: $OTP_CLIENT_NAME" \
            -d '{"query":"{ serverInfo { version gitCommit } }"}')
          version=$(printf '%s' "$resp" | jq -r '.data.serverInfo.version // empty')
          if [ -z "$version" ]; then
            echo "Could not resolve OTP version from response: $resp" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "OTP version under test: $version"

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.CI_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and install trakpi core
        run: mvn -B -f core/pom.xml install

      - name: Build and install the file storage adapter
        run: mvn -B -f storage/file/pom.xml install

      - name: Build and install the BigQuery storage adapter
        run: mvn -B -f storage/bigquery/pom.xml install

      - name: Build and install the GCS storage adapter
        run: mvn -B -f storage/gcs/pom.xml install

      - name: Build the OTP reference
        run: mvn -B -f reference/otp/pom.xml package

      - name: Run trakpi test against OTP dev (streams KPIs to BigQuery)
        run: java --enable-native-access=ALL-UNNAMED -jar reference/otp/target/trakpi.jar test --version "${{ steps.otp.outputs.version }}" --testset-version "$TRAKPI_TESTSET_VERSION" --reference-version "$TRAKPI_REFERENCE_VERSION" --config reference/otp/trakpi.properties
