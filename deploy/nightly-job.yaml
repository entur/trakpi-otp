# One trakpi-test pod runs three phases: the reference run (prod) and the candidate run (newest dev) as
# init containers — each brings its own OTP pod up, tests, tears it down, and archives its responses —
# then a compare pass as the main container, which scores the candidate against the reference from the
# archived responses (no OTP pod needed). The candidate test and the compare share a --run-id
# ($(POD_NAME), identical across containers in the pod) so the comparative KPIs land on the candidate run.
# Each test pass is a single `trakpi test --start --stop-on-completion`. POD_NAME/POD_UID (downward API)
# let OtpOrchestrator set the OTP pod's ownerReference to this pod, so Kubernetes garbage-collects a
# leaked OTP pod if this pod is killed.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: trakpi-test-
  namespace: ${NAMESPACE}
  labels:
    app: trakpi-test
spec:
  backoffLimit: 0 # a failed run is a failed run; don't silently retry
  activeDeadlineSeconds: 14400 # 4h cap (two graph builds + two scoring passes + compare)
  ttlSecondsAfterFinished: 86400 # let Kubernetes clean the finished Job up after a day
  template:
    metadata:
      labels:
        app: trakpi-test
    spec:
      serviceAccountName: ${KSA_NAME}
      restartPolicy: Never
      # The cluster enforces the "restricted" Pod Security Standard, so pod and containers must declare it.
      # runAsUser pins the distroless "nonroot" uid numerically. The kubelet can't verify a non-numeric
      # image user against runAsNonRoot, so it must be a number.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: reference
          image: ${TRAKPI_IMAGE}
          args: ["test", "--version", "${PROD_VERSION}", "--testset-version", "${TESTSET}", "--start", "--stop-on-completion"]
          securityContext: &secctx
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          env: &runenv
            - { name: TRAKPI_OTP_IMAGE_REPO, value: "${OTP_IMAGE_REPO}" }
            - { name: TRAKPI_OTP_NAMESPACE, value: "${NAMESPACE}" }
            # Node allocatable is ~27447Mi; daemonsets take ~2Gi (26000Mi did not schedule), so ~25.4Gi is
            # schedulable. 24000Mi fits with headroom; heap is 80% of it (~19Gi), near entur's builder's 20g.
            - { name: TRAKPI_OTP_MEMORY, value: "24000Mi" }
            # Keep the storage request under the node's max allocatable ephemeral storage.
            - { name: TRAKPI_OTP_EPHEMERAL_STORAGE, value: "30Gi" }
            # The full Norway build (street + transit) plus serve startup can exceed the 40-min default.
            - { name: TRAKPI_OTP_READINESS_TIMEOUT_SECONDS, value: "5400" }
            - { name: TRAKPI_BQ_PROJECT, value: "${APP_PROJECT}" }
            - { name: TRAKPI_BQ_DATASET, value: "${BQ_DATASET}" }
            - { name: TRAKPI_BQ_TABLE, value: "${BQ_TABLE}" }
            - { name: TRAKPI_GCS_BUCKET, value: "${GCS_BUCKET}" }
            - { name: GOOGLE_CLOUD_PROJECT, value: "${APP_PROJECT}" }
            # How the run was triggered (nightly vs manual), so the dashboard can keep scheduled runs pure.
            - { name: TRAKPI_RUN_ORIGIN, value: "${TRAKPI_RUN_ORIGIN}" }
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: POD_UID, valueFrom: { fieldRef: { fieldPath: metadata.uid } } }
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { memory: "1Gi" }
        # The candidate test archives its own responses; --reference-version only labels the run, and
        # --run-id ties it to the compare pass below. No in-run comparison happens here.
        - name: candidate
          image: ${TRAKPI_IMAGE}
          args: ["test", "--version", "${CANDIDATE_VERSION}", "--reference-version", "${PROD_VERSION}", "--testset-version", "${TESTSET}", "--start", "--stop-on-completion", "--run-id", "$(POD_NAME)"]
          securityContext: *secctx
          env: *runenv
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { memory: "1Gi" }
      containers:
        # Second pass: read the candidate's and reference's archived responses and write the comparative
        # KPIs under the candidate's run id. No OTP pod, so this stays small.
        - name: compare
          image: ${TRAKPI_IMAGE}
          args: ["compare", "--version", "${CANDIDATE_VERSION}", "--reference-version", "${PROD_VERSION}", "--testset-version", "${TESTSET}", "--run-id", "$(POD_NAME)"]
          securityContext: *secctx
          env: *runenv
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { memory: "1Gi" }
