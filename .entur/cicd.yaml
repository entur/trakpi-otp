# .entur/cicd.yaml — grants this repo's GitHub Actions access to the GCP project(s) via Workload
# Identity Federation, and provisions the CI service account gh-trakpi-otp-<hash>-ci@ent-github-shr.
# The nightly workflow authenticates with that identity through the CI_WORKLOAD_IDENTITY_PROVIDER and
# CI_SERVICE_ACCOUNT repository variables.
#
apiVersion: orchestrator.entur.io/github/v1
kind: GitHubActions
metadata:
  id: trakpi-otp
spec:
  environments: [tst]
